# Other supported forms:
# FIRST:2 (or F:2), LAST:4 (or L:4), FIRST_LAST:2:2 (or FL:2:2)
# EMAIL, EMAIL:2, EMAIL:1:1
# WORDS, WORDS:2, WORDS:1:1 (NAME is an alias for WORDS)
# PERCENT:60, PERCENT:50:START, PERCENT:50:MIDDLE, PERCENT:50:END
# RANGE:2:6, CARD, PAN, FULL, NONE
# Any character-based spec can optionally end with ;char=X (default is *).
# mask.cardNumber=L:4;char=X
# mask.email=EMAIL:1:1;char=#
# mask.customerName=WORDS:1:1;char=x
# Fixed replacement, regex patterns and lambdas use Java factory methods.

